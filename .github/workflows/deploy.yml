name: Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: update Translations
        env:
          CRYPTPAD_URL: ${{ secrets.CRYPTPAD_URL || vars.CRYPTPAD_URL }}
          CRYPTPAD_PASSWORD: ${{ secrets.CRYPTPAD_PASSWORD || vars.CRYPTPAD_PASSWORD }}
        run: npm run i18n:pull

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
